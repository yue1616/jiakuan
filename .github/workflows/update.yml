name: Update Subscriptions

# Serialize scheduled/manual runs so two jobs don't race while committing generated output.
concurrency:
  group: jiakuan-subscription-update-main
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 */6 * * *" # 每 6 小时自动更新（UTC）
  workflow_dispatch: # 同时保留手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Prepare sing-box runtime for unit tests
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import main_v2 as m; m.ensure_directories(); m.setup_environment()"
        env:
          PYTHONUNBUFFERED: '1'

      - name: Run parser and configuration tests
        run: python scripts/test_parsers.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: python scripts/main_v2.py
        env:
          # 便于 ip-api 等识别限速; GitHub runner 出口为美国 Azure
          PYTHONUNBUFFERED: '1'

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi

      - name: Purge jsDelivr CDN (post-push)
        if: success()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          p() { curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${REPO}@main/$1" || true; }
          p README.md
          for f in v2ray.txt clash.yaml singbox.json residential.txt residential-clash.yaml residential-singbox.json; do
            p "output/$f"
          done
          for f in v2ray.txt clash.yaml singbox.json; do
            p "output/candidates/$f"
          done
          find output/residential-by-country output/by-country -type f 2>/dev/null | while read -r f; do
            p "$f"; sleep 0.2
          done
          echo "[+] jsDelivr CDN purge done (after push)"
